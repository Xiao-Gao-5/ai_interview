<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模拟面试系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .content { padding: 30px; }
        .section { margin-bottom: 25px; }
        .section h3 {
            color: #333;
            margin-bottom: 15px;
            padding-left: 12px;
            border-left: 4px solid #667eea;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .resume-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #e9ecef;
        }
        .resume-info p { margin: 8px 0; color: #555; }
        .btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .chat-box {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            height: 420px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
            margin-bottom: 15px;
        }
        .msg {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 78%;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
        }
        .msg.interviewer {
            background: #e3f2fd;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            color: #1565c0;
        }
        .msg.candidate {
            background: #e8f5e9;
            margin-left: auto;
            border-bottom-right-radius: 4px;
            color: #2e7d32;
            text-align: right;
        }
        .input-area { display: flex; gap: 12px; }
        .input-area input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        .score-board {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
        }
        .total-score {
            text-align: center;
            font-size: 32px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .dimension {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        #radarChart { max-width: 380px; margin: 20px auto; }
        .report-text {
            line-height: 1.8;
            color: #444;
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        .hidden { display: none; }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 20px;
            font-size: 12px;
            margin: 4px 4px 0 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 AI 模拟面试系统</h1>
            <p>基于简历的智能技术面试训练平台</p>
        </div>
        <div class="content">
            <!-- 上传区域 -->
            <div id="uploadSection" class="section">
                <h3>📄 上传简历</h3>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <p>点击上传 PDF 简历，或拖拽文件到此处</p>
                    <input type="file" id="fileInput" accept=".pdf" style="display:none" onchange="handleUpload(this)">
                </div>
                <div id="resumePreview" class="resume-info hidden">
                    <h4 style="margin-bottom:12px;color:#333;">简历解析结果</h4>
                    <p><strong>技能栈：</strong><span id="skills"></span></p>
                    <p><strong>学历：</strong><span id="education"></span></p>
                    <p><strong>经历摘要：</strong><span id="experience" style="color:#666;font-size:13px;"></span></p>
                    <button class="btn" onclick="startInterview()" style="margin-top:15px;width:100%;">🚀 开始面试</button>
                </div>
            </div>

            <!-- 面试区域 -->
            <div id="interviewSection" class="section hidden">
                <h3>💬 模拟面试</h3>
                <div class="chat-box" id="chatBox"></div>
                <div class="input-area" id="inputArea">
                    <input type="text" id="userInput" placeholder="请输入你的回答..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn" onclick="sendMessage()">发送</button>
                </div>
            </div>

            <!-- 评分区域 -->
            <div id="scoreSection" class="section hidden">
                <h3>📊 面试评价报告</h3>
                <div class="score-board">
                    <div class="total-score" id="totalScore"></div>
                    <canvas id="radarChart"></canvas>
                    <div id="dimensions"></div>
                    <div class="report-text" id="reportText"></div>
                </div>
                <button class="btn" onclick="location.reload()" style="margin-top:20px;width:100%;">重新开始</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";
        let sessionId = null;
        let resumeData = null;

        async function handleUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append("file", file);
            try {
                const res = await fetch(`${API_BASE}/upload-resume`, { method: "POST", body: formData });
                const data = await res.json();
                resumeData = data.result;

                // 解析器返回 warning（如扫描件 PDF 无文字层）时明确告知用户原因
                if (resumeData.warning) {
                    alert(resumeData.warning);
                }

                const skillsContainer = document.getElementById("skills");
                skillsContainer.innerHTML = "";
                if (resumeData.skills && resumeData.skills.length > 0) {
                    resumeData.skills.forEach(s => {
                        const span = document.createElement("span");
                        span.className = "tag";
                        span.textContent = s;
                        skillsContainer.appendChild(span);
                    });
                } else {
                    skillsContainer.textContent = "未识别";
                }

                document.getElementById("education").textContent = resumeData.education || "未识别";
                document.getElementById("experience").textContent = (resumeData.experience || "未识别").substring(0, 200);
                document.getElementById("resumePreview").classList.remove("hidden");
            } catch (e) {
                alert("上传失败，请检查后端是否运行");
                console.error(e);
            }
        }

        async function startInterview() {
            const btn = document.querySelector("#resumePreview .btn");
            btn.disabled = true;
            btn.textContent = "正在初始化...";

            try {
                const res = await fetch(`${API_BASE}/start-interview`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(resumeData)
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                    btn.disabled = false;
                    btn.textContent = "🚀 开始面试";
                    return;
                }
                sessionId = data.session_id;
                document.getElementById("uploadSection").classList.add("hidden");
                document.getElementById("interviewSection").classList.remove("hidden");
                addMessage("interviewer", data.reply);
            } catch (e) {
                alert("启动面试失败: " + e.message);
                btn.disabled = false;
                btn.textContent = "🚀 开始面试";
            }
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            addMessage("candidate", text);
            input.value = "";
            input.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId, message: text })
                });
                const data = await res.json();

                if (data.error) {
                    addMessage("interviewer", "⚠️ " + data.error);
                    input.disabled = false;
                    return;
                }

                addMessage("interviewer", data.reply);

                if (data.is_end) {
                    document.getElementById("inputArea").style.display = "none";
                    setTimeout(() => showScore(data.reply), 800);
                } else {
                    input.disabled = false;
                    input.focus();
                }
            } catch (e) {
                addMessage("interviewer", "⚠️ 网络异常，请重试");
                input.disabled = false;
            }
        }

        function addMessage(role, text) {
            const box = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function showScore(jsonText) {
            try {
                const score = JSON.parse(jsonText);
                document.getElementById("interviewSection").classList.add("hidden");
                document.getElementById("scoreSection").classList.remove("hidden");
                document.getElementById("totalScore").textContent = `总分 ${score.total_score} 分`;

                const dims = score.dimensions;
                const labels = Object.keys(dims);
                const values = Object.values(dims);

                new Chart(document.getElementById("radarChart"), {
                    type: "radar",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "得分",
                            data: values,
                            backgroundColor: "rgba(102, 126, 234, 0.2)",
                            borderColor: "rgba(102, 126, 234, 1)",
                            pointBackgroundColor: "rgba(102, 126, 234, 1)",
                            pointBorderColor: "#fff",
                            pointHoverBackgroundColor: "#fff",
                            pointHoverBorderColor: "rgba(102, 126, 234, 1)"
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            r: {
                                min: 0,
                                max: 100,
                                ticks: { stepSize: 20 }
                            }
                        }
                    }
                });

                const dimDiv = document.getElementById("dimensions");
                dimDiv.innerHTML = "";
                for (const [k, v] of Object.entries(dims)) {
                    dimDiv.innerHTML += `<div class="dimension"><span>${k}</span><strong>${v}分</strong></div>`;
                }
                document.getElementById("reportText").textContent = score.report;
            } catch(e) {
                console.error(e);
                document.getElementById("reportText").textContent = "评分报告解析异常，原始数据：\n" + jsonText;
            }
        }
    </script>
</body>
</html>
